name: Continuous Deployment pipeline

on:
  push:
    branches:
      - main

jobs:
  continuous-integration:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v3
        with:
          node-version: "22.x"

      - name: Install packages
        run: npm ci

      - name: Build source code
        run: npm run build
        env:
          VITE_API_URL: "https://localhost:0123"
          VITE_API_VERSION: "v0"
          VITE_STRIPE_PUBLISHABLE_KEY: "pk_test-key"

      - name: Deploy via Wrangler
        run: npm run deploy
